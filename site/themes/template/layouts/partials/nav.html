<header class="navbar" id="navbar">
  <div class="container flex items-center justify-between" style="height: 100%;">
    <a href="#top" class="font-display font-bold text-xl text-foreground transition-colors hover:text-primary" style="letter-spacing: 0.025em;">
      {{ .Site.Params.firstName }} {{ .Site.Params.lastName }}
    </a>

    <!-- ★ 추가 (a): 오른쪽 묶음 시작 -->
    <div class="flex items-center gap-4">

      <!-- Desktop Nav (원래 있던 것 그대로) -->
      <nav class="hidden md:flex items-center gap-8" style="display: none;" id="desktop-nav">
        <button class="nav-link" data-scroll="about">{{ i18n "navAbout" }}</button>
        <button class="nav-link" data-scroll="experience">{{ i18n "navExperience" }}</button>
        <button class="nav-link" data-scroll="skills">{{ i18n "navSkills" }}</button>
        <button class="nav-link" data-scroll="education">{{ i18n "navEducation" }}</button>
        <button class="nav-link" data-scroll="contact">{{ i18n "navContact" }}</button>
        <a href="#contact" class="btn btn-primary" style="padding: 0.5rem 1.25rem; font-size: 0.875rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);" data-scroll="contact">
          {{ i18n "letsTalk" }}
        </a>
      </nav>
      <!-- 언어 전환 버튼: 지금 언어가 아닌 쪽 페이지로 가는 링크 -->
      {{ range .AllTranslations }}
        {{ if ne .Language.Lang $.Language.Lang }}
        <a href="{{ .RelPermalink }}" class="lang-toggle" hreflang="{{ .Language.Lang }}">{{ i18n "switchLang" }}</a>
        {{ end }}
      {{ end }}

      <!-- ★ 추가 (b): 다크모드 토글 버튼 -->
      <button type="button" class="theme-toggle" aria-label="{{ i18n "themeToDark" }}" data-label-dark="{{ i18n "themeToDark" }}" data-label-light="{{ i18n "themeToLight" }}">
        <svg class="icon-md icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="icon-md icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>

      <!-- Hamburger Button (원래 있던 것 그대로) -->
      <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu" aria-expanded="false" style="display: none; padding: 0.5rem; border-radius: 0.375rem; border: none; background: none; color: hsl(var(--foreground)); cursor: pointer;">
        <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg class="icon-lg" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

    <!-- ★ 추가 (c): 오른쪽 묶음 끝 -->
    </div>
  </div>
</header>

<!-- Mobile Backdrop -->
<div class="mobile-backdrop" id="mobile-backdrop"></div>

<!-- Mobile Menu -->
<nav class="mobile-menu" id="mobile-menu">
  <button class="mobile-nav-link" data-scroll="about">{{ i18n "navAbout" }}</button>
  <button class="mobile-nav-link" data-scroll="experience">{{ i18n "navExperience" }}</button>
  <button class="mobile-nav-link" data-scroll="skills">{{ i18n "navSkills" }}</button>
  <button class="mobile-nav-link" data-scroll="education">{{ i18n "navEducation" }}</button>
  <button class="mobile-nav-link" data-scroll="contact">{{ i18n "navContact" }}</button>
  <div style="margin-top: 0.5rem; margin-bottom: 0.25rem; padding: 0 0.75rem;">
    <a href="#contact" class="btn btn-primary w-full" data-scroll="contact" style="font-size: 0.875rem;">{{ i18n "letsTalk" }}</a>
  </div>
</nav>
