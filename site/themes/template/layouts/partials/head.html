
<!-- CSS가 그려지기 전에 테마를 먼저 정해서 새로고침 때 하얗게 번쩍이는 것 방지.
     그래서 외부 js 파일이 아니라 head 안에 바로 씀 -->
<script>
  (function () {
    try {
      var theme = localStorage.getItem('theme');   // 사용자가 전에 고른 값
      if (!theme) {                                 // 처음 방문이면 OS 설정 따라감
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}                                  // 저장소 막힌 브라우저 대비
  })();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ .Site.Title }}</title>
<meta name="description" content="{{ .Site.Params.description }}">

<!-- Favicon -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥔</text></svg>">

<!-- Open Graph -->
<meta property="og:title" content="{{ .Site.Title }}">
<meta property="og:description" content="{{ .Site.Params.description }}">
<meta property="og:image" content="{{ .Site.Params.ogImage | absURL }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Site.Title }}">
<meta name="twitter:description" content="{{ .Site.Params.description }}">
<meta name="twitter:image" content="{{ .Site.Params.ogImage | absURL }}">

<!-- CSS -->
{{ $mainCSS := resources.Get "css/main.css" }}
{{ $animCSS := resources.Get "css/animations.css" }}
{{ if $mainCSS }}<link rel="stylesheet" href="{{ $mainCSS.RelPermalink }}">{{ end }}
{{ if $animCSS }}<link rel="stylesheet" href="{{ $animCSS.RelPermalink }}">{{ end }}
