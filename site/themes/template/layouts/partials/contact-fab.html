<!-- Floating Contact Button (simplified chatbot replacement) -->
<div id="contact-fab-popover" class="fab-popover">
  <p class="font-semibold text-sm mb-3 text-foreground">{{ i18n "fabTitle" }}</p>
  <div style="display: flex; flex-direction: column; gap: 0.5rem;">
    <a href="mailto:{{ .Site.Params.email }}?subject=Portfolio%20Inquiry" class="flex items-center gap-3 p-3 rounded-lg transition-colors" style="border: 1px solid hsl(var(--border)); background: hsl(var(--muted) / 0.3);">
      <svg class="icon-md text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      <div>
        <p class="text-xs text-muted">{{ i18n "email" }}</p>
        <p class="text-sm font-medium text-foreground">{{ .Site.Params.email }}</p>
      </div>
    </a>
    <a href="{{ .Site.Params.github }}" target="_blank" rel="noreferrer" class="flex items-center gap-3 p-3 rounded-lg transition-colors" style="border: 1px solid hsl(var(--border)); background: hsl(var(--muted) / 0.3);">
      <svg class="icon-md text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
      <div>
        <p class="text-xs text-muted">{{ i18n "github" }}</p>
        <p class="text-sm font-medium text-foreground">{{ i18n "connect" }}</p>
      </div>
    </a>
  </div>
</div>

<button id="contact-fab" class="fab" aria-label="{{ i18n "contactButton" }}" aria-expanded="false">
  <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>
